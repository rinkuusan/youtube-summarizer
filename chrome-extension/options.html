<!doctype html><html lang="ja"><meta charset="utf-8"><title>動画ノート 設定</title>
<style>body{min-width:340px;max-width:600px;margin:20px;font:14px/1.7 system-ui;background:#f4f1e8;color:#273121}h1{font-size:20px;border-bottom:3px solid #657a4c}label{display:block;margin:12px 0}input[type=password]{box-sizing:border-box;width:100%;padding:7px}button{background:#425b32;color:white;border:0;padding:8px 14px;cursor:pointer}small{display:block;color:#59634f}#status{white-space:pre-wrap}</style>
<h1>動画ノート 設定</h1>
<label><input type="checkbox" id="auto"> 実視聴3分で自動取得</label>
<label>希望する字幕言語 <select id="language"><option value="auto">動画の字幕から選択</option><option value="ja">日本語優先</option><option value="en">英語優先</option></select></label>
<label>Supadata APIキー（任意）<input id="key" type="password" autocomplete="off"></label>
<small>直接取得できなかったとき、動画上のボタンから確認して利用します。既存字幕のみ取得し、AI文字起こしは行いません。キーは拡張内に保存し、YouTubeのページには渡しません。</small>
<p><button id="save">設定を保存</button></p><div id="status" role="status"></div>
<details><summary>前回のAPI処理が未確定の場合</summary><p>通信切断などで課金状況が不明な処理は自動再送しません。Supadataの利用状況を確認してから解除してください。再取得すると追加で消費する可能性があります。</p><button id="unlock">未確定状態を解除</button></details>
<script src="options.js"></script></html>
